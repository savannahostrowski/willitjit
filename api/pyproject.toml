[project]
name = "willitjit-web"
version = "0.1.0"
description = "FastAPI host for the Will It JIT? compatibility dashboard"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.138.1",
    "fastar>=0.12.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "main:app"
