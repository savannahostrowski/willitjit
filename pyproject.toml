[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "willitjit"
version = "0.1.0"
description = "Run upstream package test suites with the CPython JIT off and on"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "packaging>=25.0",
    "prek>=0.4.14",
]

[project.scripts]
willitjit = "willitjit.cli:main"
