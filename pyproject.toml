[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "willitjit"
version = "0.1.0"
description = "Run upstream package test suites with the CPython JIT off and on"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "prek>=0.4.14",
]

[project.scripts]
willitjit = "jit_package_compat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jit_package_compat"]

[tool.hatch.build.targets.wheel.force-include]
"src/jit_package_compat/data/top25.toml" = "jit_package_compat/data/top25.toml"
