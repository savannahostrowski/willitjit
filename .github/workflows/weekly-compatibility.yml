name: Weekly Will It JIT? compatibility

on:
  schedule:
    # Monday at 09:17 UTC. The non-round minute reduces scheduled-job congestion.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing workflow run ID to merge without rerunning surveys
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-willitjit-compatibility
  cancel-in-progress: false

env:
  CPYTHON_VERSION: 3.14.6
  TOP_N: "20"
  SHARD_COUNT: "4"

jobs:
  survey:
    name: ${{ matrix.os }} shard ${{ matrix.shard_index }}
    if: inputs.source_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        shard_index: [0, 1, 2, 3]
        include:
          - os: linux
            runner: ubuntu-26.04
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-2025

    steps:
      - name: Check out survey
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install host Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install JIT CPython from uv
        if: matrix.os != 'windows'
        shell: bash
        run: |
          uv python install "$CPYTHON_VERSION"
          python_path="$(uv python find --managed-python "$CPYTHON_VERSION")"
          echo "TARGET_PYTHON=$python_path" >> "$GITHUB_ENV"
          "$python_path" --version

      - name: Install official JIT CPython on Windows
        if: matrix.os == 'windows'
        id: windows-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.CPYTHON_VERSION }}
          architecture: x64

      - name: Select official JIT CPython on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          "TARGET_PYTHON=${{ steps.windows-python.outputs.python-path }}" >> $env:GITHUB_ENV
          & "${{ steps.windows-python.outputs.python-path }}" --version

      - name: Install survey
        run: uv sync --locked --python 3.11

      - name: Verify JIT toggle
        shell: bash
        run: uv run willitjit check-python --python "$TARGET_PYTHON"

      - name: Run paired CPython smoke test
        shell: bash
        run: |
          PYTHON_JIT=0 "$TARGET_PYTHON" -c "import ssl, sys; assert not sys._jit.is_enabled(); assert sum(range(10_000)) == 49_995_000"
          PYTHON_JIT=1 "$TARGET_PYTHON" -c "import ssl, sys; assert sys._jit.is_enabled(); assert sum(range(10_000)) == 49_995_000"

      - name: Run paired package suites
        shell: bash
        env:
          SURVEY_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.shard_index }}
        run: |
          uv run willitjit run \
            --python "$TARGET_PYTHON" \
            --limit "$TOP_N" \
            --shard-count "$SHARD_COUNT" \
            --shard-index "${{ matrix.shard_index }}" \
            --run-id "$SURVEY_RUN_ID" \
            --allow-findings \
            --stream-test-output

      - name: Upload raw result and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-${{ matrix.os }}-${{ matrix.shard_index }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            runs/*/run.json
            runs/*/SUMMARY.md
            runs/*/*/logs/**/*.log

  merge:
    name: Merge public JSON
    if: always()
    needs: survey
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out survey
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Download available shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: raw-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || github.run_id }}

      - name: Merge compatibility results
        run: |
          uv sync --locked
          uv run willitjit merge \
            --input artifacts \
            --output compatibility-results.json \
            --limit "$TOP_N" \
            --expected-platform Linux \
            --expected-platform macOS \
            --expected-platform Windows

      - name: Upload compatibility JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-results
          path: compatibility-results.json
          if-no-files-found: error
          retention-days: 90
