version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 14
    groups:
      root-python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 14
    groups:
      api-python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 14
    groups:
      frontend-runtime-minor-patch:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-development-minor-patch:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 14
    groups:
      hooks-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
