[dataset]
source = "https://github.com/hugovk/top-pypi-packages/blob/main/top-pypi-packages-30-days.json"
last_update = "2026-08-01 06:34:08"
window = "30 days"

[[packages]]
rank = 1
name = "boto3"
downloads = 3717556977
repository = "https://github.com/boto/boto3.git"
ref = "HEAD"
install = [
  ["-m", "pip", "install", "git+https://github.com/boto/botocore.git@develop", "git+https://github.com/boto/jmespath.git@develop", "git+https://github.com/boto/s3transfer.git@develop"],
  ["-m", "pip", "install", "-r", "requirements-dev-lock.txt"],
  ["-m", "pip", "install", "-e", "."],
]
test = ["-m", "pytest", "unit", "functional"]
test_cwd = "tests"
timeout_seconds = 1800
note = "Installs the three develop dependencies non-editably because uv rejects editable Git URLs in requirements.txt; integration tests are excluded."
isolate_home = true

