[package]
rank = 18
name = "aiobotocore"
downloads = 1164834706
repository = "https://github.com/aio-libs/aiobotocore.git"
ref = "3.9.0"
release_version = "3.9.0"
release_date = "2026-08-01T11:54:06.128433Z"
install = [
  ["-m", "pip", "install", "build"],
  ["-m", "build", "--wheel", "--outdir", "dist"],
  ["-m", "pip", "install", "--force-reinstall", "--no-deps", "dist/aiobotocore-{release_version}-py3-none-any.whl"],
]
test = ["-P", "-m", "pytest", "-vv", "-m", "not localonly", "-n", "auto", "--dist", "worksteal", "--log-cli-level=DEBUG", "--http-backend=aiohttp"]
timeout_seconds = 1800
environment = { "HTTP_BACKEND" = "aiohttp", "PYTHONTRACEMALLOC" = "5" }
note = "Matches upstream's Linux Moto lane without coverage, using its frozen test group and installed wheel. -P keeps the checkout from shadowing the installed package."
isolate_home = true
guidance = [
  "https://github.com/aio-libs/aiobotocore/blob/9e70a4e371cf9698062cc79c54567f9f050fdfe9/CONTRIBUTING.rst",
  "https://github.com/aio-libs/aiobotocore/blob/9e70a4e371cf9698062cc79c54567f9f050fdfe9/pyproject.toml",
  "https://github.com/aio-libs/aiobotocore/blob/9e70a4e371cf9698062cc79c54567f9f050fdfe9/.github/workflows/ci-cd.yml",
]
uv_sync = ["--frozen", "--no-install-project", "--no-default-groups", "--group", "test"]

[[package.overrides]]
platform = "Darwin"
skip_reason = "Not tested: upstream's Moto CI lane runs on Linux and requires Docker for Lambda tests."
note = "Do not turn missing Docker into a macOS baseline failure."

[[package.overrides]]
platform = "Windows"
skip_reason = "Not tested: upstream's Moto CI lane runs on Linux and requires Docker for Lambda tests."
note = "Do not replace the documented Linux lane with an incomplete Windows subset."
