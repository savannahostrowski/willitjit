[[package.overrides]]
runtime = "free-threaded"
platform = "Linux"
install = [["-m", "pip", "install", "--group", "tests"], ["-m", "pip", "install", "-e", ".[all]"], ["-m", "pip", "install", "--force-reinstall", "--no-binary", ":all:", "sqlalchemy"]]
