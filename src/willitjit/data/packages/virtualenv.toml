[package]
rank = 76
name = "virtualenv"
downloads = 532873318
repository = "https://github.com/pypa/virtualenv.git"
ref = "21.7.4"
release_version = "21.7.4"
release_date = "2026-08-10T22:54:31.515567Z"
install = [
  ["-m", "pip", "install", "build"],
  ["-m", "build", "--wheel", "--outdir", "dist"],
  ["-m", "pip", "install", "--group", "test", "dist/virtualenv-{release_version}-py3-none-any.whl"],
]
test = ["-P", "-m", "pytest", "tests", "-m", "not slow", "-p", "no:xdist"]
