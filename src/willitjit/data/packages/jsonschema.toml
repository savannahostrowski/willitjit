  "https://github.com/python-jsonschema/jsonschema/blob/a7277432b0f7bcd0551f6e589d30457017125df4/.github/workflows/ci.yml",
]

[[package.overrides]]
platform = "Windows"
install = [
  ["-m", "pip", "install", "--group", "test"],
  ["-m", "pip", "install", "-e", "."],
]
note = "Upstream excludes the format-extra variants on Windows, so this uses its no-extras test lane."
